# Demo sector pack: food and beverage processors with high-care zones.
#
# An excerpt written for this case study to show plug and play. It has the
# same shape as the production medical device pack (about 1,100 terms); only
# the vocabulary changes. The crawler, the four guards, the agents and the
# workbook read it unchanged.
#
# The buyer is the same kind of customer: a plant whose own controlled zone
# uses up consumables every shift. Here
# that zone is a high-care or high-risk area rather than a classified
# cleanroom, so the verdict labels keep their names and change their meaning:
#   in_house             operates its own high-care, high-risk or aseptic zone
#   likely_in_house      makes ready-to-eat or chilled product itself, no zone stated
#   no_cleanroom_needed  the product line could never need one
#   unknown              the pages do not settle it

version: food_processing_demo_v0.1
sector: food_processing
term_count: 35   # this excerpt only

scoring:
  bands:
    in_house: score >= 10 AND at least one DIRECT term with the company as subject
    likely_in_house: score 6-9 with no DIRECT term; OR any STRONG positive product with
      no outsourcing cue and no negative determination. Always needs_manual_review
    outsourced: a company-subject OUTSOURCED_CUE outranks the zone evidence
    no_cleanroom_needed: negative_subtotal <= -8 AND at least one negative_products term
      matched AND no STRONG positive product present
    unknown: everything else
  weights:
    DIRECT_possessive: 10
    DIRECT_bare: 7
    STRONG_INFERRED: 5
    MEDIUM_INFERRED: 3
    WEAK_INFERRED: 1
    TRAP: 0
    NEGATIVE: -4
    OUTSOURCED_CUE: -5
    SELLER: -6

attribution_rules:
- Zone evidence counts only when the grammatical subject is the company.
- A sentence about where the PRODUCT is used (your kitchen, your plant) is never
  facility evidence about the company.
- A co-packer named as the maker moves the qualified lead to the co-packer.

evidence_direct:
- term: high care area
  tier: DIRECT
  weight: 10
  match: regex
  variants:
  - high[- ]care (zone|area|facility)
  - high[- ]risk (zone|area)
  - aseptic (filling|processing) (room|suite|line)
  - positive[- ]pressure (production|packing) (room|hall)
  pages:
  - facilities
  - manufacturing
  - quality
  - careers
  term_pattern: \bhigh[- ]care\ (zone|area|facility)\b

positive_products:
- term: ready-to-eat meals
  tier: STRONG_INFERRED
  weight: 5
  match: literal
  variants:
  - chilled ready meals
  - sliced cooked meats
  - prepared salads
  - fresh-cut produce
  pages:
  - products
  - capabilities
- term: infant formula
  tier: STRONG_INFERRED
  weight: 5
  match: literal
  variants:
  - aseptic dairy
  - extended shelf life milk
  pages:
  - products

negative_products:
- term: dry pasta
  tier: NEGATIVE
  weight: -4
  match: literal
  variants:
  - bagged flour
  - whole grains
  - roasted coffee beans
  pages:
  - products

trap_terms:
# Carried by nearly every food manufacturer. Seen, then discounted to zero.
- term: haccp
  tier: TRAP
  weight: 0
  match: literal
  variants:
  - haccp certified
  - food safety plan
  - fda registered facility
  - gfsi certified
  pages:
  - quality

seller_cues:
- term: we supply processors
  tier: SELLER
  weight: -6
  match: literal
  variants:
  - equipment for high-care areas
  - hygienic design solutions
  pages:
  - products
  - markets

outsourcing_cues:
- term: produced by our co-packer
  tier: OUTSOURCED_CUE
  weight: -5
  match: literal
  variants:
  - manufactured for us by
  - contract packed
  pages:
  - about
  - products

careers_titles:
- term: high care operative
  tier: DIRECT
  weight: 7
  match: literal
  variants:
  - high risk hygiene operative
  - aseptic filler operator
  pages:
  - careers

discovery_paths:
- term: /food-safety
  tier: ROUTING
  weight: 0
  match: literal
  variants:
  - /quality
  - /our-facilities
  - /sites
  pages:
  - quality
  - facilities
