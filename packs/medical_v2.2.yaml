'#': generated
version: medical_v2.2
sector: medical_devices
derived_from: medical_v2.1
generated: '2026-08-20'
term_count: 1139
notes: 'Pass-2 tuning against the blind manual review of batch 1. Three changes matter more than the vocabulary: the numeric
  ISO/class rows are now anchored regex (as bare literals they matched inside iso 13485 and class 100000 and awarded DIRECT
  weight to almost every site), the verdict bands close the 6-9-with-a-DIRECT-term gap, and no_cleanroom_needed now needs
  a negative margin rather than a single -4 term.'
scoring:
  bands:
    in_house: score >= 10 AND at least one DIRECT term; OR score 6-9 with a DIRECT term AND an R5 possessive/self-subject
      match (confidence 0.55-0.65)
    likely_in_house: score 6-9 with no DIRECT term; OR any STRONG positive product with no company-subject outsourcing cue
      and no negative determination. Always needs_manual_review
    outsourced: a company-subject OUTSOURCED_CUE outranks the cleanroom evidence
    no_cleanroom_needed: negative_subtotal <= -8 AND at least one negative_products term matched AND no STRONG positive product
      present
    unknown: everything else
  weights:
    DIRECT_possessive: 10
    DIRECT_bare: 7
    STRONG_INFERRED: 5
    MEDIUM_INFERRED: 3
    WEAK_INFERRED: 1
    TRAP: 0
    IN_HOUSE_CUE: 2
    NEGATIVE: -4
    OUTSOURCED_CUE: -5
    SELLER: -6
  v2_1_changes:
  - 'in_house band extended: a bare first-person cleanroom sentence (DIRECT_bare = 7) previously could not reach the >=10
    floor, so vaportheq.com ("Vaportheq clean room team", own careers page) fell through every band to unknown. Score 6-9
    with a DIRECT term was undefined.'
  - 'The >=10 floor also contradicted tab 2 edge case "controlled but unclassified -> in_house with iso_class null": under
    v2 bands that row could only reach in_house if a class number was present.'
  - no_cleanroom_needed threshold moved from <= -4 to <= -8. At -4 a single broad negative noun (microscope -5, centrifuge
    -5, ventilator -3) was a complete determination on its own.
  - IN_HOUSE_CUE total capped at +6 so cue-stacking alone cannot reach the in_house floor without a DIRECT term.
  in_house_cue_cap: 6
  recalibration_warning: These thresholds were set against v2/v2.1 scores that were inflated by span double-counting (M5).
    After M5 lands, re-score the 40 batch-1 domains and re-fit the bands BEFORE tuning any individual weight. Do not treat
    the current numbers as validated.
attribution_rules:
- Cleanroom evidence counts only when the grammatical subject is the company (possessive test, R5).
- An outsourcing cue counts only when its subject is the company in the present tense; leadership bios about prior employers
  do not count (R6).
- Careers evidence counts only from the registrable domain or a verified ATS board for that company (R7).
- A seller_cue suppresses co-occurring cleanroom evidence unless a possessive cue is also present (R8).
- Outsourced sterilization does not negate an in-house cleanroom (R9).
- A STRONG positive product with no contradicting outsourcing cue may not return no_cleanroom_needed; floor is likely_in_house
  (R10).
- 'NEW R20 - contract_manufacturer polarity: "contract manufacturer" is an OUTSOURCED_CUE only when the company is the buyer.
  When the company is the subject (we are a contract manufacturer, our contract manufacturing services, the phrase appears
  on the domain''s own capabilities page) the cue weight is 0 and entity_type is contract_manufacturer.'
- 'NEW R21 - customer-environment scoping: a sentence describing where the PRODUCT is used (the operating room, your GMP facility,
  your clinical trials, a single OR) is never facility evidence about the company. This is R5 applied to the object rather
  than the subject.'
- 'NEW R22 - entity-establishing cues are not cleanroom cues: hand crafted, designed and manufactured in, full service manufacturer
  set entity_type=manufacturer and may corroborate, but may never alone move cleanroom_status above unknown.'
