    NO_VERDICT: run_status.discovery_failed|blocked
    in_house-lean: likely_in_house
    enterprise: run_status.skipped_enterprise
label_rules:
- entity_type is determined before cleanroom_status and gates it; only manufacturer and contract_manufacturer are eligible
  for in_house.
- cleanroom_vendor disqualifies outright.
- run_status is pipeline health and is never emitted as a verdict; discovery_failed must not pass through as unknown.
- no_cleanroom_needed may only be emitted when a term from negative_products matched; a justification citing a positive-list
  term is a pack inconsistency and must fail loudly.
- likely_in_house always sets needs_manual_review and never auto-writes to the CRM.
- when outsourced and a contract manufacturer is named populate referred_domain.
- domains over 1000 employees route to run_status skipped_enterprise and are excluded from the goldset.
matching:
  contract: matcher.py in this directory IS the spec. If prose and matcher.py disagree, matcher.py is right. Every change
    to matching must land as a failing test in test_matcher.py first.
  normalize:
  - lowercase
  - curly apostrophe and en/em dash to ascii
  - apply canonicalize map (unchanged from v2)
  - collapse whitespace runs to a single space and trim
  rules:
  - 'M1 literal rows: match the normalized term or any variant as a whole-word substring. Word boundaries apply to EVERY literal
    regardless of length. v2 applied them only under 5 characters which let "iso 1" match inside "iso 13485".'
  - 'M2 regex rows: compile term_pattern (NOT the bare term field) and every variant. v2.1 anchored the variants and left
    the term field bare so a faithful loader reintroduced the bug on 37 rows.'
  - 'M3 ambiguity gate: 135 variants that are ordinary English words or bare unit symbols were removed in v2.2 (tab, sec,
    psi, mat, des, aus, dp, bet, sip, cer, annex i, bare grade a, at rest, in operation, pascals). Word boundaries do not
    help for real words. Never re-add a variant under 4 characters without a context requirement.'
  - 'M4 needs_context: a variant listed under needs_context scores only when the row term or another variant appears within
    200 characters of it. Applies to genuine acronyms worth keeping (hepa, ffu, wfi, laf, cfu, ach).'
  - M5 SPAN DEDUP - the rule that makes thresholds mean anything. Collect every candidate match with its character span. Within
    each dedup_family (see below) sort by span length descending then absolute weight descending and consume the span; no
    later row in that family may claim overlapping characters. Families are deduped INDEPENDENTLY so an attribution cue ("our
    ISO 7 cleanroom", IN_HOUSE_CUE 2) does not swallow the evidence term underneath it ("iso 7", DIRECT 7). Global dedup scored
    that sentence 2 instead of 16. Without dedup at all it scored 55, because the token cleanroom alone appears in 182 rows
    worth 560 points.
  - M6 a row scores at most once per page however many of its variants hit.
  - 'M7 suppress_if_preceded_by: if present on a row and the pattern matches the 30 characters before the span, the match
    is discarded. Used on "controlled environment" to kill temperature/climate controlled.'
  - M8 iso_class is produced by a dedicated extractor over normalized text, never by term matching.
  - M9 legacy class 100/1000/10000/100000 map to ISO 5/6/7/8. EU grade a and b to ISO 5, c to ISO 7, d to ISO 8.
  - M10 match on normalized text but capture the evidence quote verbatim from the ORIGINAL text using the original offsets.
  - 'M11 emit matched_terms[] per domain: term, weight, tier, page url, character span, verbatim quote. Without it no weight
    in this pack is a measurement and nobody can see a single fact scoring 55.'
  dedup_families:
    evidence:
    - evidence_direct
    - evidence_strong_inferred
    - evidence_weak_inferred
    - careers_phrases
    - careers_titles
    products:
    - positive_products
    - negative_products
    cues:
    - in_house_cues
    - outsourcing_cues
    - seller_cues
    - service_vendor_cues
    - staffing_tells
    traps:
    - trap_terms
    routing:
    - page_keywords
    - discovery_paths
