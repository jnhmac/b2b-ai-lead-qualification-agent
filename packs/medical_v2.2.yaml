review_instrument:
  note: The batch-1 manual review was done by live site visit, not from crawler output. Quote columns in the review sheet
    are machine-populated; only verdict, certainty, iso_class, site_checked and notes are human. Two separate analyses misread
    this. Mark machine columns explicitly in the batch-2 sheet.
  required_columns:
  - verdict
  - certainty
  - entity_type
  - crawl_failed
  - saw_that_crawl_missed
  - notes
  verdict_options:
  - in_house
  - likely_in_house
  - outsourced
  - no_cleanroom_needed
  - unknown
  dropped_recommendation: Do NOT cap certainty by crawled page count. Reviewers work from the live site so crawl depth is
    irrelevant to their confidence.
