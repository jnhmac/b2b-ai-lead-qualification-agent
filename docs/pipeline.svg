<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="The pipeline as one line: free discovery, the owner's yes to spend, two pages first, six checks, all ten pages only if unsure, a blind expert review, a compare that stops agreements, the diagnostician on disagreements only, the owner's approval feeding the rule book, and a free hand-over.">
  <style>
    .s  { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m  { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .t1 { font-size: 26px; font-weight: 600; fill: #E8E6E1; letter-spacing: -0.3px; }
    .t2 { font-size: 13.5px; fill: #8B949E; }
    .eb { font-size: 11px; fill: #6E767F; letter-spacing: 1.6px; }
    .nm { font-size: 14px; font-weight: 600; fill: #E8E6E1; }
    .dc { font-size: 11px; fill: #8B949E; }
    .ix { font-size: 10px; fill: #545B63; }
    .cf { font-size: 9.5px; fill: #8B949E; letter-spacing: 0.6px; }
    .ca { font-size: 9.5px; fill: #F2A33A; letter-spacing: 0.6px; }
    .cg { font-size: 9.5px; fill: #4CAF7D; letter-spacing: 0.6px; }
    .ai { font-size: 8.5px; font-weight: 600; fill: #0F1419; letter-spacing: 0.8px; }
    .lb { font-size: 11px; fill: #C9C7C2; }
    .la { font-size: 11px; fill: #F2A33A; }
    .lg { font-size: 11px; fill: #4CAF7D; }
    .ac { font-size: 10px; fill: #6E767F; letter-spacing: 1.6px; }
    .pc { font-size: 10.5px; fill: #6E767F; }
    .bx { fill: #1A2027; stroke: #262C33; }
  </style>

  <rect width="1200" height="560" rx="14" fill="#0F1419"/>

  <text class="m eb" x="29" y="46">WEBSITE LEAD QUALIFIER</text>
  <text class="s t1" x="29" y="80">Two pages first. All ten only if unsure.</text>
  <text class="s t2" x="29" y="105">One company travels one line. Each stage writes to disk before the next one reads. Agents check; the owner decides.</text>

  <!-- rule book loop: owner back to expert -->
  <path d="M961 160 V140 H640 V156" fill="none" stroke="#F2A33A" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M635 150 l5 7 5 -7" fill="none" stroke="#F2A33A" stroke-width="1.6"/>
  <text class="s la" x="660" y="133">Every ruling goes in the rule book the expert reads next session</text>

  <!-- 01 discover -->
  <rect class="bx" x="29" y="160" width="134" height="160" rx="10"/>
  <text class="m ix" x="43" y="182">01</text>
  <text class="s nm" x="43" y="206">Discover</text>
  <text class="s dc" x="43" y="228">Sitemap and nav,</text>
  <text class="s dc" x="43" y="244">10 pages picked,</text>
  <text class="s dc" x="43" y="260">nothing bought.</text>
  <text class="m cf" x="43" y="302">FREE</text>

  <!-- 02 two pages -->
  <rect class="bx" x="173" y="160" width="134" height="160" rx="10" stroke="#8C632B"/>
  <text class="m ix" x="187" y="182">02</text>
  <text class="s nm" x="187" y="206">Two pages</text>
  <text class="s dc" x="187" y="228">Homepage and best</text>
  <text class="s dc" x="187" y="244">product page.</text>
  <text class="s dc" x="187" y="260">Exit A, B or C.</text>
  <text class="m ca" x="187" y="302">2 CREDITS</text>

  <!-- 03 six checks -->
  <rect class="bx" x="317" y="160" width="134" height="160" rx="10"/>
  <text class="m ix" x="331" y="182">03</text>
  <text class="s nm" x="331" y="206">Six checks</text>
  <text class="s dc" x="331" y="228">Image name, words,</text>
  <text class="s dc" x="331" y="244">verbatim, subject,</text>
  <text class="s dc" x="331" y="260">pitch, whose room.</text>
  <text class="m ca" x="331" y="302">INFERENCE</text>

  <!-- 04 all ten -->
  <rect class="bx" x="461" y="160" width="134" height="160" rx="10" stroke="#8C632B"/>
  <text class="m ix" x="475" y="182">04</text>
  <text class="s nm" x="475" y="206">All ten</text>
  <text class="s dc" x="475" y="228">Only for exit C or</text>
  <text class="s dc" x="475" y="244">a refused check.</text>
  <text class="s dc" x="475" y="260">Verdict settled.</text>
  <text class="m ca" x="475" y="302">8 MORE CREDITS</text>

  <!-- 05 expert -->
  <rect class="bx" x="605" y="160" width="134" height="160" rx="10" stroke="#8C632B"/>
  <rect x="671" y="152" width="58" height="16" rx="3" fill="#F2A33A"/>
  <text class="s ai" x="678" y="163">AI AGENT</text>
  <text class="m ix" x="619" y="182">05</text>
  <text class="s nm" x="619" y="206">Expert, blind</text>
  <text class="s dc" x="619" y="228">Reads the site, 12</text>
  <text class="s dc" x="619" y="244">per chunk, never</text>
  <text class="s dc" x="619" y="260">the crawl's verdict.</text>
  <text class="m ca" x="619" y="302">INFERENCE ONLY</text>

  <!-- 06 diagnostician -->
  <rect class="bx" x="749" y="160" width="134" height="160" rx="10" stroke="#8C632B"/>
  <rect x="815" y="152" width="58" height="16" rx="3" fill="#F2A33A"/>
  <text class="s ai" x="822" y="163">AI AGENT</text>
  <text class="m ix" x="763" y="182">06</text>
  <text class="s nm" x="763" y="206">Diagnostician</text>
  <text class="s dc" x="763" y="228">Disagreements</text>
  <text class="s dc" x="763" y="244">only: the cause and</text>
  <text class="s dc" x="763" y="260">the smallest fix.</text>
  <text class="m ca" x="763" y="302">INFERENCE ONLY</text>

  <!-- 07 owner -->
  <rect class="bx" x="893" y="160" width="134" height="160" rx="10" stroke="#31694F"/>
  <text class="m ix" x="907" y="182">07</text>
  <text class="s nm" x="907" y="206">Owner</text>
  <text class="s dc" x="907" y="228">One sheet, at most</text>
  <text class="s dc" x="907" y="244">20 items, a yes or</text>
  <text class="s dc" x="907" y="260">no each.</text>
  <text class="m cg" x="907" y="302">A PERSON</text>

  <!-- 08 hand-over -->
  <rect class="bx" x="1037" y="160" width="134" height="160" rx="10" stroke="#31694F"/>
  <text class="m ix" x="1051" y="182">08</text>
  <text class="s nm" x="1051" y="206">Hand-over</text>
  <text class="s dc" x="1051" y="228">Integrity check,</text>
  <text class="s dc" x="1051" y="244">locations, one</text>
  <text class="s dc" x="1051" y="260">workbook per list.</text>
  <text class="m cg" x="1051" y="302">FREE</text>

  <!-- the line -->
  <path d="M96 320v30M240 320v30M384 320v30M528 320v30M672 320v30M816 320v30M960 320v30M1104 320v30" stroke="#434649" stroke-width="1.6"/>
  <line x1="29" y1="350" x2="1171" y2="350" stroke="#434649" stroke-width="3" stroke-dasharray="30 16"/>

  <!-- spend gate on the line -->
  <rect x="166" y="336" width="5" height="30" rx="2" fill="#8B949E"/>
  <rect x="168" y="338" width="20" height="5" rx="2" fill="#4CAF7D" transform="rotate(-50 168 340)"/>
  <text class="s lg" x="168" y="392" text-anchor="middle">owner's yes to spend</text>

  <!-- compare on the line -->
  <rect x="736" y="342" width="16" height="16" rx="2" fill="#1A2027" stroke="#F2A33A" stroke-width="1.6" transform="rotate(45 744 350)"/>
  <text class="s la" x="726" y="392">compare: agreements stop here</text>

  <!-- early exit bypass under the line -->
  <path d="M384 358 v54 h284 v-48" fill="none" stroke="#4CAF7D" stroke-width="1.4" stroke-dasharray="4 4"/>
  <path d="M663 370 l5 -7 5 7" fill="none" stroke="#4CAF7D" stroke-width="1.4"/>
  <text class="s lb" x="396" y="430">Exit A or B, every check passed: no full read</text>

  <!-- acts -->
  <path d="M29 456 v8 h566 v-8 M605 456 v8 h422 v-8 M1037 456 v8 h134 v-8" fill="none" stroke="#262C33" stroke-width="1.4"/>
  <text class="m ac" x="312" y="482" text-anchor="middle">READ</text>
  <text class="m ac" x="816" y="482" text-anchor="middle">REVIEW</text>
  <text class="m ac" x="1104" y="482" text-anchor="middle">DELIVER</text>

  <!-- notes -->
  <text class="s pc" x="29" y="516">A company costs 2 credits or 10, never anything in between by choice. Credits track how many companies settle early.</text>
  <text class="s pc" x="29" y="536">Pages stay on disk keyed by crawl date, so any fix is replayed on stored companies for inference only before it ships.</text>
</svg>
