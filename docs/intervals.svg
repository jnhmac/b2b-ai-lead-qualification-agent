<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 476" width="1100" height="476" role="img" aria-label="Wilson 95% confidence intervals on a 23-company holdout. Exact-label accuracy 78.3% CI 58.1 to 90.3. Qualified-lead precision 90.0% CI 59.6 to 98.2. Qualified-lead recall 75.0% CI 46.8 to 91.1. True base rate of qualified leads 52.2% CI 33.0 to 70.8.">
  <style>
    .s  { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m  { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .eb { font-size: 11px; fill: #6E767F; letter-spacing: 1.6px; }
    .t1 { font-size: 24px; font-weight: 600; fill: #E8E6E1; letter-spacing: -0.3px; }
    .t2 { font-size: 13.5px; fill: #8B949E; }
    .rn { font-size: 14px; fill: #C9C7C2; }
    .rv { font-size: 15px; fill: #E8E6E1; }
    .rf { font-size: 11.5px; fill: #6E767F; }
    .ci { font-size: 12px; fill: #8B949E; }
    .ax { font-size: 11px; fill: #545B63; }
    .fn { font-size: 12.5px; fill: #6E767F; }
    .sep{ font-size: 10.5px; fill: #545B63; letter-spacing: 1.2px; }
  </style>

  <rect width="1100" height="476" fill="#0F1419"/>

  <text class="m eb" x="40" y="42">TIER B HOLDOUT &#183; N = 23 &#183; WILSON 95%</text>
  <text class="s t1" x="40" y="76">Every number is an interval</text>
  <text class="s t2" x="40" y="100">The width is the finding. On a holdout this size, the point estimate alone is a claim about noise.</text>

  <!-- gridlines -->
  <line x1="310" y1="128" x2="310" y2="396" stroke="#232A31"/>
  <line x1="465" y1="128" x2="465" y2="396" stroke="#1A2027"/>
  <line x1="620" y1="128" x2="620" y2="396" stroke="#1A2027"/>
  <line x1="775" y1="128" x2="775" y2="396" stroke="#1A2027"/>
  <line x1="930" y1="128" x2="930" y2="396" stroke="#232A31"/>

  <!-- row 1: exact-label accuracy -->
  <text class="s rn" x="40" y="155">Exact-label accuracy</text>
  <text class="m rv" x="290" y="155" text-anchor="end">78.3%</text>
  <text class="m rf" x="40" y="173">18 / 23</text>
  <line x1="310" y1="150" x2="930" y2="150" stroke="#1A2027"/>
  <rect x="670" y="146" width="200" height="8" rx="4" fill="#F2A33A" fill-opacity="0.24"/>
  <line x1="670" y1="141" x2="670" y2="159" stroke="#8C632B" stroke-width="1.5"/>
  <line x1="870" y1="141" x2="870" y2="159" stroke="#8C632B" stroke-width="1.5"/>
  <circle cx="796" cy="150" r="5.5" fill="#F2A33A" stroke="#0F1419" stroke-width="2"/>
  <text class="m ci" x="950" y="155">[58.1 to 90.3]</text>

  <!-- row 2: lead precision -->
  <text class="s rn" x="40" y="217">Precision</text>
  <text class="m rv" x="290" y="217" text-anchor="end">90.0%</text>
  <text class="m rf" x="40" y="235">9 / 10</text>
  <line x1="310" y1="212" x2="930" y2="212" stroke="#1A2027"/>
  <rect x="680" y="208" width="239" height="8" rx="4" fill="#F2A33A" fill-opacity="0.24"/>
  <line x1="680" y1="203" x2="680" y2="221" stroke="#8C632B" stroke-width="1.5"/>
  <line x1="919" y1="203" x2="919" y2="221" stroke="#8C632B" stroke-width="1.5"/>
  <circle cx="868" cy="212" r="5.5" fill="#F2A33A" stroke="#0F1419" stroke-width="2"/>
  <text class="m ci" x="950" y="217">[59.6 to 98.2]</text>

  <!-- row 3: lead recall -->
  <text class="s rn" x="40" y="279">Recall</text>
  <text class="m rv" x="290" y="279" text-anchor="end">75.0%</text>
  <text class="m rf" x="40" y="297">9 / 12</text>
  <line x1="310" y1="274" x2="930" y2="274" stroke="#1A2027"/>
  <rect x="600" y="270" width="275" height="8" rx="4" fill="#F2A33A" fill-opacity="0.24"/>
  <line x1="600" y1="265" x2="600" y2="283" stroke="#8C632B" stroke-width="1.5"/>
  <line x1="875" y1="265" x2="875" y2="283" stroke="#8C632B" stroke-width="1.5"/>
  <circle cx="775" cy="274" r="5.5" fill="#F2A33A" stroke="#0F1419" stroke-width="2"/>
  <text class="m ci" x="950" y="279">[46.8 to 91.1]</text>

  <!-- separator -->
  <line x1="40" y1="320" x2="1060" y2="320" stroke="#1D232A"/>
  <rect x="40" y="313" width="182" height="14" fill="#0F1419"/>
  <text class="m sep" x="40" y="323">THE POPULATION, NOT THE MODEL</text>

  <!-- row 4: base rate -->
  <text class="s rn" x="40" y="369">True base rate</text>
  <text class="m rv" x="290" y="369" text-anchor="end">52.2%</text>
  <text class="m rf" x="40" y="387">12 / 23</text>
  <line x1="310" y1="364" x2="930" y2="364" stroke="#1A2027"/>
  <rect x="515" y="360" width="234" height="8" rx="4" fill="#7E868F" fill-opacity="0.22"/>
  <line x1="515" y1="355" x2="515" y2="373" stroke="#545B63" stroke-width="1.5"/>
  <line x1="749" y1="355" x2="749" y2="373" stroke="#545B63" stroke-width="1.5"/>
  <circle cx="634" cy="364" r="5.5" fill="#8B949E" stroke="#0F1419" stroke-width="2"/>
  <text class="m ci" x="950" y="369">[33.0 to 70.8]</text>

  <!-- axis -->
  <text class="m ax" x="310" y="416" text-anchor="middle">0%</text>
  <text class="m ax" x="465" y="416" text-anchor="middle">25%</text>
  <text class="m ax" x="620" y="416" text-anchor="middle">50%</text>
  <text class="m ax" x="775" y="416" text-anchor="middle">75%</text>
  <text class="m ax" x="930" y="416" text-anchor="middle">100%</text>

  <text class="s fn" x="40" y="454">Dot is the point estimate, bar is the 95% Wilson interval. Precision and recall are on qualified leads. The evaluation harness prints these beside every result.</text>
</svg>
