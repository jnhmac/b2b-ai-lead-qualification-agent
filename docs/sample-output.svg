<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="The in_house sheet of the sample workbook: fictional companies, each with a verdict, a one-sentence reason, a verbatim evidence quote and its URL.">
  <style>
    .s  { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .h  { font-size: 12px; font-weight: 600; fill: #1F2A37; }
    .c  { font-size: 11.5px; fill: #27313D; }
    .v  { font-size: 11.5px; fill: #136F4A; font-weight: 600; }
    .u  { font-size: 10.5px; fill: #2457A6; }
    .tb { font-size: 11.5px; fill: #3B4652; }
    .ta { font-size: 11.5px; fill: #1F2A37; font-weight: 600; }
    .n  { font-size: 10.5px; fill: #7A8491; }
  </style>

  <rect width="1200" height="360" rx="10" fill="#FFFFFF" stroke="#D5DAE1"/>

  <!-- sheet tabs -->
  <rect x="0" y="0" width="1200" height="34" rx="10" fill="#F3F5F8"/>
  <rect x="0" y="24" width="1200" height="10" fill="#F3F5F8"/>
  <text class="s tb" x="20" y="22">Summary</text>
  <rect x="88" y="6" width="80" height="28" rx="4" fill="#FFFFFF" stroke="#D5DAE1"/>
  <text class="s ta" x="102" y="24">in_house</text>
  <text class="s tb" x="186" y="22">likely_in_house</text>
  <text class="s tb" x="300" y="22">Needs review</text>

  <!-- header row -->
  <rect x="0" y="34" width="1200" height="32" fill="#DCE6F1"/>
  <text class="s h" x="16" y="55">company_name</text>
  <text class="s h" x="196" y="55">verdict</text>
  <text class="s h" x="276" y="55">why_this_verdict</text>
  <text class="s h" x="596" y="55">evidence</text>
  <text class="s h" x="936" y="55">evidence_url</text>
  <g stroke="#C4CEDA"><line x1="186" y1="34" x2="186" y2="330"/><line x1="266" y1="34" x2="266" y2="330"/><line x1="586" y1="34" x2="586" y2="330"/><line x1="926" y1="34" x2="926" y2="330"/></g>

  <!-- row 1 -->
  <text class="s c" x="16" y="88">Northfield Catheter Co.</text>
  <text class="m v" x="196" y="88">in_house</text>
  <text class="s c" x="276" y="88">Its own capabilities page states an ISO</text>
  <text class="s c" x="276" y="104">Class 7 cleanroom for catheter assembly.</text>
  <text class="s c" x="596" y="88">&#8220;Our ISO Class 7 cleanroom supports</text>
  <text class="s c" x="596" y="104">catheter assembly and packaging.&#8221;</text>
  <text class="m u" x="936" y="88">northfield-catheter.example/</text>
  <text class="m u" x="936" y="104">capabilities</text>
  <line x1="0" y1="122" x2="1200" y2="122" stroke="#E4E8EE"/>

  <!-- row 2 -->
  <text class="s c" x="16" y="144">Bluewater Implant Finishing</text>
  <text class="m v" x="196" y="144">in_house</text>
  <text class="s c" x="276" y="144">Its quality page states a Class 10,000</text>
  <text class="s c" x="276" y="160">clean room for final cleaning of implants.</text>
  <text class="s c" x="596" y="144">&#8220;Final cleaning and passivation take place</text>
  <text class="s c" x="596" y="160">in our Class 10,000 clean room before</text>
  <text class="s c" x="596" y="176">sterile packaging.&#8221;</text>
  <text class="m u" x="936" y="144">bluewater-implant.example/quality</text>
  <line x1="0" y1="194" x2="1200" y2="194" stroke="#E4E8EE"/>

  <!-- row 3 -->
  <text class="s c" x="16" y="216">Cedar Ridge Molding</text>
  <text class="m v" x="196" y="216">in_house</text>
  <text class="s c" x="276" y="216">Its careers page recruits operators to</text>
  <text class="s c" x="276" y="232">gown and work in its own ISO 8 molding cell.</text>
  <text class="s c" x="596" y="216">&#8220;Cleanroom Molding Operator, 2nd shift:</text>
  <text class="s c" x="596" y="232">gown and work in our ISO 8 molding cell.&#8221;</text>
  <text class="m u" x="936" y="216">cedarridge-molding.example/careers/</text>
  <text class="m u" x="936" y="232">cleanroom-molding-operator</text>
  <line x1="0" y1="250" x2="1200" y2="250" stroke="#E4E8EE"/>

  <text class="s n" x="16" y="280">Six more columns in the workbook: website_url, sector, location_count, locations, lead_status and what_they_do.</text>
  <text class="s n" x="16" y="300">Every quote is copied verbatim from the cited page. On likely_in_house and Needs review rows the evidence column stays empty.</text>
  <text class="s n" x="16" y="320">All companies and URLs are fictional.</text>
</svg>
